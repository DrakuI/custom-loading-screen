<div class="ls-preview-form">
  <p class="hint">{{localize "LOADING_SCREEN.PreviewHint"}}</p>
  <div class="form-group">
    <label>{{localize "DOCUMENT.Scene"}}</label>
    <div class="form-fields">
      <select name="sceneId">
        {{selectOptions scenes selected=sceneId blank=(localize "LOADING_SCREEN.PreviewNoScene")}}
      </select>
    </div>
  </div>
  <div class="form-group">
    <label>{{localize "LOADING_SCREEN.PreviewDuration"}}</label>
    <div class="form-fields">
      <input type="number" name="duration" value="{{duration}}" min="1" max="120" step="1">
    </div>
  </div>
</div>
