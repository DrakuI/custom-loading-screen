<!-- Cinematic Loading Screen Template (fork: backgrounds filled by script, tips anchored to the bottom) -->
<div id="loading-screen-overlay" class="loading-template-cinematic">
  <div class="ls-backgrounds"></div>
  <div class="cinematic-overlay"></div>
  <div class="cinematic-vignette"></div>
  <div class="loading-screen-content cinematic-content">
    <div class="cinematic-header">
      {{#if customText}}<div class="cinematic-title">{{customText}}</div>{{/if}}
      {{#if sceneName}}<div class="cinematic-subtitle">{{sceneName}}</div>{{/if}}
    </div>
    {{#if showProgress}}
    <div class="cinematic-progress">
      <div class="cinematic-progress-track">
        <div class="cinematic-progress-fill" id="loading-progress-fill"></div>
      </div>
    </div>
    {{/if}}
  </div>
  {{#if showTips}}
  <footer class="ls-tips">
    <div class="ls-tip">
      <p id="loading-tip-text" class="ls-tip-text">{{currentTip}}</p>
    </div>
  </footer>
  {{/if}}
  <div class="ls-skip-hint">{{labels.skip}}</div>
</div>
