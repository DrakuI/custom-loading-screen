<div class="ls-tips-editor">
  <p class="hint">{{localize "LOADING_SCREEN.CustomTipsDescription"}}</p>
  <textarea name="customTips" placeholder="{{placeholder}}" spellcheck="true">{{customTips}}</textarea>
  <p class="hint">
    <i class="fa-solid fa-circle-info" inert></i> {{localize "LOADING_SCREEN.CustomTipsHelp"}}
    <span class="ls-tip-count">{{localize "LOADING_SCREEN.CustomTipsCount" count=count}}</span>
  </p>
</div>
